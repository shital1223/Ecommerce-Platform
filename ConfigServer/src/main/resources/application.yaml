server:
  port: 8888
spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/shital1223/MicroServices-Config.git
          default-label: main
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_PAT}

management:
  endpoints:
    web:
      exposure:
        include: health,info